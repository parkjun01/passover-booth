<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인원 랜덤 추천기</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Tone.js (효과음 생성용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Canvas Confetti (축하 폭죽 효과) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* 애니메이션 효과 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-indigo-50 via-white to-purple-50 text-slate-800">

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden transition-all">
        
        <!-- 헤더 -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-white text-center relative">
            <h1 class="text-2xl font-black tracking-tight flex items-center justify-center gap-2">
                <span>🎲</span> 스마트 인원 추천기
            </h1>
            <p class="text-indigo-100 text-sm mt-1">이름을 넣고 원하는 인원만큼 공정하게 뽑아보세요!</p>
            
            <!-- 사운드 토글 버튼 -->
            <button id="soundToggle" class="absolute top-4 right-4 p-2 rounded-full bg-white/20 hover:bg-white/30 transition text-white" title="효과음 켜기/끄기">
                <svg id="soundOnIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" />
                </svg>
                <svg id="soundOffIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM12.293 7.293a1 1 0 011.414 0L15 8.586l1.293-1.293a1 1 0 111.414 1.414L16.414 10l1.293 1.293a1 1 0 01-1.414 1.414L15 11.414l-1.293 1.293a1 1 0 01-1.414-1.414L13.586 10l-1.293-1.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <!-- 본문 영역 -->
        <div class="p-6 space-y-6">
            
            <!-- 1. 이름 입력 섹션 -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="nameInput" class="text-sm font-bold text-slate-700">참여자 추가</label>
                    <button id="bulkToggleBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium underline">
                        여러 명 한꺼번에 붙여넣기
                    </button>
                </div>

                <!-- 단일 입력 폼 -->
                <div id="singleInputBox" class="flex gap-2">
                    <input type="text" id="nameInput" placeholder="이름 입력 후 엔터 (예: 홍길동)" 
                        class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm">
                    <button id="addBtn" class="px-5 py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold rounded-xl transition shadow-sm text-sm whitespace-nowrap">
                        추가
                    </button>
                </div>

                <!-- 다중 입력 폼 (기본 숨김) -->
                <div id="bulkInputBox" class="hidden space-y-2">
                    <textarea id="bulkTextarea" rows="3" placeholder="쉼표(,)나 줄바꿈으로 구분해서 여러 명을 입력하세요.&#10;예: 김철수, 이영희, 박민수" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
                    <div class="flex justify-end gap-2">
                        <button id="cancelBulkBtn" class="px-3 py-1.5 text-xs font-medium text-slate-500 hover:bg-slate-100 rounded-lg">취소</button>
                        <button id="addBulkBtn" class="px-4 py-1.5 text-xs font-bold bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">일괄 추가하기</button>
                    </div>
                </div>
            </div>

            <!-- 2. 참여자 명단 표시 영역 -->
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                        대기 명단 (<span id="totalCount" class="text-indigo-600 font-extrabold">0</span>명)
                    </span>
                    <button id="clearAllBtn" class="text-xs text-rose-500 hover:text-rose-700 font-medium hidden">
                        전체 삭제
                    </button>
                </div>
                
                <!-- 이름 태그 목록 -->
                <div id="nameList" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-1">
                    <p id="emptyMsg" class="text-sm text-slate-400 w-full text-center py-4">
                        아직 추가된 사람이 없습니다.<br>위에서 이름을 추가해주세요!
                    </p>
                </div>
            </div>

            <!-- 3. 추천 인원 설정 섹션 -->
            <div class="flex items-center justify-between bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100">
                <div>
                    <span class="block text-sm font-bold text-slate-800">추천받을 인원 수</span>
                    <span class="text-xs text-slate-500">몇 명을 뽑을까요?</span>
                </div>
                <div class="flex items-center gap-3 bg-white px-3 py-1.5 rounded-xl border border-indigo-100 shadow-sm">
                    <button id="decreaseCount" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold active:scale-90 transition">-</button>
                    <span id="pickCountDisplay" class="w-8 text-center font-black text-lg text-indigo-600">1</span>
                    <button id="increaseCount" class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold active:scale-90 transition">+</button>
                </div>
            </div>

            <!-- 4. 추첨 실행 버튼 -->
            <button id="pickBtn" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 active:scale-[0.98] text-white font-black text-lg rounded-2xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                <span>✨</span> 추천 인원 뽑기
            </button>

            <!-- 5. 결과 출력 섹션 (초기 숨김) -->
            <div id="resultSection" class="hidden pt-4 border-t border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                        <span>🎉</span> 최종 추천 결과
                    </h2>
                    <button id="copyResultBtn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg font-medium transition flex items-center gap-1">
                        <span>📋</span> 결과 복사
                    </button>
                </div>
                
                <!-- 결과 카드 리스트 -->
                <div id="resultList" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <!-- 자바스크립트로 동적 생성 -->
                </div>
            </div>

        </div>
    </div>

    <!-- 커스텀 토스트 알림창 (alert 대체용) -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full text-sm font-medium shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 whitespace-nowrap">
        메시지 내용
    </div>

    <script>
        // 상태 관리 변수
        let participants = [];
        let pickCount = 1;
        let isSoundEnabled = true;
        let isPicking = false;

        // DOM 요소 참조
        const nameInput = document.getElementById('nameInput');
        const addBtn = document.getElementById('addBtn');
        const bulkToggleBtn = document.getElementById('bulkToggleBtn');
        const singleInputBox = document.getElementById('singleInputBox');
        const bulkInputBox = document.getElementById('bulkInputBox');
        const bulkTextarea = document.getElementById('bulkTextarea');
        const addBulkBtn = document.getElementById('addBulkBtn');
        const cancelBulkBtn = document.getElementById('cancelBulkBtn');
        
        const nameList = document.getElementById('nameList');
        const emptyMsg = document.getElementById('emptyMsg');
        const totalCount = document.getElementById('totalCount');
        const clearAllBtn = document.getElementById('clearAllBtn');
        
        const decreaseCount = document.getElementById('decreaseCount');
        const increaseCount = document.getElementById('increaseCount');
        const pickCountDisplay = document.getElementById('pickCountDisplay');
        
        const pickBtn = document.getElementById('pickBtn');
        const resultSection = document.getElementById('resultSection');
        const resultList = document.getElementById('resultList');
        const copyResultBtn = document.getElementById('copyResultBtn');
        
        const soundToggle = document.getElementById('soundToggle');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');
        const toast = document.getElementById('toast');

        // Tone.js 신디사이저 설정 (효과음)
        let synth = null;
        function initAudio() {
            if (!synth && window.Tone) {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.volume.value = -8;
            }
        }

        function playTickSound() {
            if (!isSoundEnabled) return;
            initAudio();
            if (synth) {
                synth.triggerAttackRelease("C5", "32n");
            }
        }

        function playWinSound() {
            if (!isSoundEnabled) return;
            initAudio();
            if (synth) {
                const now = Tone.now();
                synth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now);
                synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "4n", now + 0.15);
            }
        }

        // 토스트 알림 표시 함수
        let toastTimeout;
        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // 참여자 목록 UI 렌더링
        function renderParticipants() {
            totalCount.textContent = participants.length;
            
            if (participants.length === 0) {
                nameList.innerHTML = '';
                nameList.appendChild(emptyMsg);
                emptyMsg.classList.remove('hidden');
                clearAllBtn.classList.add('hidden');
            } else {
                emptyMsg.classList.add('hidden');
                clearAllBtn.classList.remove('hidden');
                nameList.innerHTML = '';

                participants.forEach((name, index) => {
                    const badge = document.createElement('div');
                    badge.className = 'inline-flex items-center gap-1.5 bg-white border border-slate-200 px-3 py-1.5 rounded-full text-sm font-medium text-slate-700 shadow-sm animate-pop';
                    badge.innerHTML = `
                        <span>${escapeHTML(name)}</span>
                        <button onclick="removeParticipant(${index})" class="text-slate-400 hover:text-rose-500 focus:outline-none transition ml-0.5" title="삭제">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    `;
                    nameList.appendChild(badge);
                });
            }

            // 추천 인원수가 전체 인원수보다 크면 자동 조정
            if (participants.length > 0 && pickCount > participants.length) {
                pickCount = participants.length;
                pickCountDisplay.textContent = pickCount;
            }
        }

        // XSS 방지용 이스케이프 함수
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        // 단일 이름 추가
        function addParticipant() {
            const name = nameInput.value.trim();
            if (!name) {
                showToast('이름을 입력해주세요!');
                nameInput.focus();
                return;
            }
            if (participants.includes(name)) {
                showToast('이미 명단에 있는 이름입니다.');
                nameInput.select();
                return;
            }
            participants.push(name);
            nameInput.value = '';
            nameInput.focus();
            renderParticipants();
        }

        // 다중 이름 일괄 추가
        function addBulkParticipants() {
            const rawText = bulkTextarea.value.trim();
            if (!rawText) {
                showToast('추가할 이름을 입력해주세요!');
                return;
            }
            // 쉼표, 줄바꿈, 탭 등으로 분리
            const names = rawText.split(/[\n,\t]+/).map(n => n.trim()).filter(n => n.length > 0);
            let addedCount = 0;
            let duplicateCount = 0;

            names.forEach(name => {
                if (!participants.includes(name)) {
                    participants.push(name);
                    addedCount++;
                } else {
                    duplicateCount++;
                }
            });

            bulkTextarea.value = '';
            toggleBulkMode(false);
            renderParticipants();

            if (addedCount > 0) {
                showToast(`${addedCount}명이 추가되었습니다.` + (duplicateCount > 0 ? ` (중복 ${duplicateCount}명 제외)` : ''));
            } else if (duplicateCount > 0) {
                showToast('입력한 이름이 모두 이미 명단에 있습니다.');
            }
        }

        // 개별 삭제
        window.removeParticipant = function(index) {
            if (isPicking) return;
            participants.splice(index, 1);
            renderParticipants();
        };

        // 일괄 입력 모드 토글
        function toggleBulkMode(showBulk) {
            if (showBulk) {
                singleInputBox.classList.add('hidden');
                bulkInputBox.classList.remove('hidden');
                bulkToggleBtn.textContent = '한 명씩 입력하기';
                bulkTextarea.focus();
            } else {
                bulkInputBox.classList.add('hidden');
                singleInputBox.classList.remove('hidden');
                bulkToggleBtn.textContent = '여러 명 한꺼번에 붙여넣기';
                nameInput.focus();
            }
        }

        // 피셔-예이츠(Fisher-Yates) 셔플 알고리즘 (공정한 무작위 추출)
        function getRandomSample(arr, count) {
            const shuffled = [...arr];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, count);
        }

        // 추첨 실행 애니메이션 및 로직
        function startPicking() {
            if (isPicking) return;

            if (participants.length === 0) {
                showToast('먼저 참여자 이름을 추가해주세요!');
                nameInput.focus();
                return;
            }

            if (pickCount > participants.length) {
                showToast(`참여자 수(${participants.length}명)보다 많은 인원을 뽑을 수 없습니다.`);
                return;
            }

            isPicking = true;
            pickBtn.disabled = true;
            pickBtn.classList.add('opacity-75', 'cursor-not-allowed');
            pickBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 추천 인원 선발 중...`;

            resultSection.classList.remove('hidden');
            
            // 슬롯머신처럼 빠르게 이름이 바뀌는 연출 (1.2초 동안)
            let shuffleSteps = 15;
            let currentStep = 0;

            const interval = setInterval(() => {
                const tempSample = getRandomSample(participants, pickCount);
                renderResults(tempSample, false);
                playTickSound();
                currentStep++;

                if (currentStep >= shuffleSteps) {
                    clearInterval(interval);
                    // 최종 당첨자 결정
                    const finalWinners = getRandomSample(participants, pickCount);
                    renderResults(finalWinners, true);
                    playWinSound();
                    
                    // 폭죽 효과 실행
                    if (window.confetti) {
                        confetti({
                            particleCount: 80,
                            spread: 70,
                            origin: { y: 0.6 }
                        });
                    }

                    // 버튼 상태 복구
                    isPicking = false;
                    pickBtn.disabled = false;
                    pickBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                    pickBtn.innerHTML = `<span>🔄</span> 다시 추천받기`;
                }
            }, 80);
        }

        // 결과 카드 렌더링
        function renderResults(winners, isFinal) {
            resultList.innerHTML = '';
            winners.forEach((name, idx) => {
                const card = document.createElement('div');
                if (isFinal) {
                    card.className = 'flex items-center gap-3 p-3.5 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md animate-pop';
                    card.style.animationDelay = `${idx * 0.08}s`;
                    card.innerHTML = `
                        <span class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center font-black text-sm shrink-0">
                            ${idx + 1}
                        </span>
                        <span class="font-bold text-base truncate">${escapeHTML(name)}</span>
                    `;
                } else {
                    card.className = 'flex items-center gap-3 p-3.5 rounded-2xl bg-slate-100 text-slate-500 border border-slate-200';
                    card.innerHTML = `
                        <span class="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center font-bold text-sm shrink-0">
                            ?
                        </span>
                        <span class="font-medium text-base truncate">${escapeHTML(name)}</span>
                    `;
                }
                resultList.appendChild(card);
            });
        }

        // 이벤트 리스너 등록
        addBtn.addEventListener('click', addParticipant);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addParticipant();
        });

        bulkToggleBtn.addEventListener('click', () => {
            const isHidden = bulkInputBox.classList.contains('hidden');
            toggleBulkMode(isHidden);
        });
        cancelBulkBtn.addEventListener('click', () => toggleBulkMode(false));
        addBulkBtn.addEventListener('click', addBulkParticipants);

        clearAllBtn.addEventListener('click', () => {
            if (isPicking) return;
            participants = [];
            pickCount = 1;
            pickCountDisplay.textContent = pickCount;
            resultSection.classList.add('hidden');
            renderParticipants();
            showToast('명단이 초기화되었습니다.');
        });

        decreaseCount.addEventListener('click', () => {
            if (pickCount > 1) {
                pickCount--;
                pickCountDisplay.textContent = pickCount;
            }
        });

        increaseCount.addEventListener('click', () => {
            const maxAllowed = participants.length > 0 ? participants.length : 99;
            if (pickCount < maxAllowed) {
                pickCount++;
                pickCountDisplay.textContent = pickCount;
            } else if (participants.length > 0) {
                showToast(`최대 ${participants.length}명까지 선택할 수 있습니다.`);
            }
        });

        pickBtn.addEventListener('click', startPicking);

        // 결과 복사 기능 (iframe 호환 execCommand 사용)
        copyResultBtn.addEventListener('click', () => {
            const winnerElements = resultList.querySelectorAll('span.truncate');
            if (winnerElements.length === 0) return;

            const names = Array.from(winnerElements).map((el, i) => `${i + 1}. ${el.textContent}`).join('\n');
            const copyText = `[🎉 인원 추천 결과]\n${names}`;

            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = copyText;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            try {
                document.execCommand('copy');
                showToast('추천 결과가 클립보드에 복사되었습니다!');
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(tempTextarea);
        });

        // 효과음 켜기/끄기
        soundToggle.addEventListener('click', () => {
            isSoundEnabled = !isSoundEnabled;
            if (isSoundEnabled) {
                soundOnIcon.classList.remove('hidden');
                soundOffIcon.classList.add('hidden');
                showToast('효과음이 켜졌습니다.');
            } else {
                soundOnIcon.classList.add('hidden');
                soundOffIcon.classList.remove('hidden');
                showToast('효과음이 꺼졌습니다.');
            }
        });

        // 초기 렌더링
        renderParticipants();
    </script>
</body>
</html>
