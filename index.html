<title>유월절 부스 리허설 카드 (최종판)</title>
<style>
  :root{
    --bg:#f4f1ea; --bg2:#ffffff; --ink:#20202a; --sub:#6b6a63;
    --line:rgba(32,32,42,.12);
    --gold:#a97a1f; --gold-soft:#f2e2b8;
    --wine:#7c2632; --wine-soft:#f3dadd;
    --slate:#2f4858; --slate-soft:#dbe6ea;
    --card-shadow: 0 1px 2px rgba(20,18,10,.06), 0 18px 40px -22px rgba(20,18,10,.35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14131c; --bg2:#1c1b28; --ink:#eeeadf; --sub:#a39d8c;
      --line:rgba(238,234,223,.14);
      --gold:#e0b355; --gold-soft:#3a3018;
      --wine:#e08b93; --wine-soft:#3a2027;
      --slate:#9fc2d6; --slate-soft:#20313c;
      --card-shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 50px -20px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14131c; --bg2:#1c1b28; --ink:#eeeadf; --sub:#a39d8c;
    --line:rgba(238,234,223,.14);
    --gold:#e0b355; --gold-soft:#3a3018;
    --wine:#e08b93; --wine-soft:#3a2027;
    --slate:#9fc2d6; --slate-soft:#20313c;
    --card-shadow: 0 1px 2px rgba(0,0,0,.4), 0 24px 50px -20px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#f4f1ea; --bg2:#ffffff; --ink:#20202a; --sub:#6b6a63;
    --line:rgba(32,32,42,.12);
    --gold:#a97a1f; --gold-soft:#f2e2b8;
    --wine:#7c2632; --wine-soft:#f3dadd;
    --slate:#2f4858; --slate-soft:#dbe6ea;
    --card-shadow: 0 1px 2px rgba(20,18,10,.06), 0 18px 40px -22px rgba(20,18,10,.35);
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family: "Malgun Gothic","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;
    display:flex; justify-content:center; padding:28px 16px 48px;
  }
  .stage{ width:100%; max-width:640px; display:flex; flex-direction:column; gap:16px; }

  .top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .title{
    font-family:Georgia,"Iowan Old Style","Nanum Myeongjo",serif;
    font-size:21px; letter-spacing:.01em; margin:0;
  }
  .title small{ display:block; font-family:inherit; font-size:12px; color:var(--sub); font-weight:400; margin-top:2px; letter-spacing:.04em;}
  .topbtns{ display:flex; gap:8px; flex-shrink:0; }
  .modebtn{
    border:1px solid var(--line); background:var(--bg2); color:var(--ink);
    border-radius:999px; padding:7px 13px; font-size:12.5px; cursor:pointer;
  }
  .modebtn:hover{ border-color:var(--gold); }
  .modebtn.active{ border-color:var(--wine); color:var(--wine); }

  .qrpanel{
    display:none; flex-direction:column; align-items:center; gap:8px;
    background:var(--bg2); border:1px solid var(--line); border-radius:16px;
    padding:18px; box-shadow:var(--card-shadow);
  }
  .qrpanel.show{ display:flex; }
  .qrbox{ background:#fff; padding:10px; border-radius:10px; }
  .qrbox svg{ width:160px; height:160px; display:block; }
  .qrcaption{ font-size:12.5px; color:var(--sub); }
  .qrurl{ font-size:11px; color:var(--sub); word-break:break-all; text-align:center; max-width:260px; }

  .scenebar{ display:flex; gap:5px; }
  .scenebar .seg{ flex:1; height:4px; border-radius:2px; background:var(--line); }
  .scenebar .seg.done{ background:var(--gold); }
  .scenebar .seg.now{ background:var(--wine); }

  .counter{ display:flex; justify-content:space-between; font-size:12px; color:var(--sub); font-variant-numeric: tabular-nums; letter-spacing:.02em;}

  .card{
    background:var(--bg2); border:1px solid var(--line); border-radius:18px;
    padding:26px 24px 22px; box-shadow:var(--card-shadow);
    display:flex; flex-direction:column; gap:14px; min-height:260px;
  }
  .badgerow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; letter-spacing:.03em; padding:5px 11px 5px 9px;
    border-radius:999px;
  }
  .badge.상황{ background:var(--gold-soft); color:var(--gold); }
  .badge.질문{ background:var(--wine-soft); color:var(--wine); }
  .badge.정답{ background:var(--slate-soft); color:var(--slate); }
  .badge.지문{ background:var(--line); color:var(--sub); }
  .badge::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .speaker{ font-size:11.5px; color:var(--sub); font-weight:600; }
  .scenetag{ font-size:12px; color:var(--sub); font-weight:600; }

  .en{ font-family:Georgia,"Iowan Old Style",serif; font-size:18px; line-height:1.55; white-space:pre-line; }
  .kr{ font-size:15.5px; line-height:1.65; color:var(--ink); white-space:pre-line; }
  .en.action, .kr.action{ font-style:italic; color:var(--sub); text-align:center; }
  .kr.hidden, .en.hidden{ filter: blur(7px); user-select:none; cursor:pointer; opacity:.7; }
  .hint{ font-size:11.5px; color:var(--sub); }

  .picker{ display:none; align-items:center; gap:12px; margin-top:2px; padding-top:14px; border-top:1px dashed var(--line); flex-wrap:wrap; }
  .picker-label{ font-size:12.5px; color:var(--sub); font-weight:600; }
  .picker-row{ display:flex; gap:8px; }
  .num-chip{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background:var(--bg); color:var(--sub); font-weight:700; font-size:15px;
    font-variant-numeric: tabular-nums; transition: background .1s, color .1s, transform .1s;
  }
  .num-chip.active{ background:var(--wine); border-color:var(--wine); color:#fff; transform:scale(1.12); }
  .pickbtn{
    margin-left:auto; border:1px solid var(--gold); background:var(--gold-soft); color:var(--gold);
    border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .pickbtn:hover{ filter:brightness(1.05); }
  .pickhint{ flex-basis:100%; font-size:11px; color:var(--sub); }

  .teamsize{ display:flex; align-items:center; gap:8px; }
  .teamsize-label{ font-size:12px; color:var(--sub); font-weight:600; }
  .sizebtn{
    border:1px solid var(--line); background:var(--bg2); color:var(--sub);
    border-radius:8px; padding:6px 12px; font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .sizebtn.active{ border-color:var(--wine); color:var(--wine); background:var(--wine-soft); }
  .sizebtn:hover{ border-color:var(--gold); }

  .nav{ display:flex; align-items:center; gap:10px; }
  .navbtn{
    flex:1; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg2); color:var(--ink); font-size:14.5px; cursor:pointer; font-weight:600;
  }
  .navbtn.primary{ background:var(--wine); border-color:var(--wine); color:#fff; }
  .navbtn:disabled{ opacity:.35; cursor:default; }
  .navbtn:hover:not(:disabled){ border-color:var(--gold); }
  .navbtn.primary:hover:not(:disabled){ filter:brightness(1.08); }

  .jump{ display:flex; flex-wrap:wrap; gap:6px; }
  .jump button{
    border:1px solid var(--line); background:var(--bg2); color:var(--sub);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;
  }
  .jump button.active{ border-color:var(--wine); color:var(--wine); font-weight:700; }
  .jump button:hover{ border-color:var(--gold); color:var(--ink); }

  .listwrap{ display:none; flex-direction:column; gap:10px; }
  .listwrap.show{ display:flex; }
  .stage.list .card, .stage.list .nav, .stage.list .scenebar, .stage.list .counter{ display:none; }
  .row{ background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; }
  .row .en{ font-size:14.5px; }
  .row .kr{ font-size:13.5px; color:var(--sub); }
  .row .meta{ display:flex; gap:8px; align-items:center; }
  .row .n{ font-size:11px; color:var(--sub); }

  footer{ text-align:center; font-size:11.5px; color:var(--sub); padding-top:4px; }

  @media (prefers-reduced-motion: no-preference){
    .card{ animation: rise .25s ease; }
    @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  }
</style>

let i = 0;
const revealed = new Set();
let spinning = false;
const picks = {};
let seen = new Set();
let lastPick = null;
let teamSize = 3;

function allNumbers(){ return Array.from({length: teamSize}, (_, k) => k + 1); }

function resetPickState(){
  Object.keys(picks).forEach(k => delete picks[k]);
  seen = new Set();
  lastPick = null;
}

function pickNumber(){
  let pool = allNumbers().filter(n => seen.size < teamSize ? !seen.has(n) : true);
  pool = pool.filter(n => n !== lastPick);
  if(pool.length === 0) pool = allNumbers().filter(n => n !== lastPick);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  seen.add(pick);
  lastPick = pick;
  return pick;
}

const badgeEl = document.getElementById('badge');
const speakerEl = document.getElementById('speaker');
const enEl = document.getElementById('enText');
const krEl = document.getElementById('krText');
const hintEl = document.getElementById('hint');
const counterText = document.getElementById('counterText');
const sceneText = document.getElementById('sceneText');
const scenebarEl = document.getElementById('scenebar');
const jumpEl = document.getElementById('jump');
const listwrapEl = document.getElementById('listwrap');
const stageEl = document.getElementById('stage');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const quizBtn = document.getElementById('quizBtn');
const listToggle = document.getElementById('listToggle');
const qrToggle = document.getElementById('qrToggle');
const qrPanel = document.getElementById('qrPanel');
const pickerEl = document.getElementById('picker');
const pickerRow = document.getElementById('pickerRow');
const pickBtn = document.getElementById('pickBtn');
const pickHint = document.getElementById('pickHint');
const chips = [...pickerRow.querySelectorAll('.num-chip')];
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const sizeBtns = [...document.querySelectorAll('.sizebtn')];

function buildScenebar(){
  scenebarEl.innerHTML = '';
  DATA.forEach((_, idx) => {
    const d = document.createElement('div');
    d.className = 'seg' + (idx < i ? ' done' : idx === i ? ' now' : '');
    scenebarEl.appendChild(d);
  });
}

function buildJump(){
  const scenes = [...new Set(DATA.map(r => r[0]))];
  jumpEl.innerHTML = '';
  scenes.forEach(s => {
    const b = document.createElement('button');
    b.textContent = s;
    b.addEventListener('click', () => {
      i = DATA.findIndex(r => r[0] === s);
      quizMode = false;
      render();
    });
    jumpEl.appendChild(b);
  });
}

function render(){
  const [scene, kind, speaker, tag, en, kr] = DATA[i];
  badgeEl.textContent = tag ? `${kind} · ${tag}` : kind;
  badgeEl.className = 'badge ' + kind;
  speakerEl.textContent = speaker;

  const isAnswer = kind === '정답';
  const isAction = kind === '지문';
  const isHidden = isAnswer && !revealed.has(i);
  enEl.textContent = en;
  krEl.textContent = kr;
  enEl.className = 'en' + (isHidden ? ' hidden' : '') + (isAction ? ' action' : '');
  krEl.className = 'kr' + (isHidden ? ' hidden' : '') + (isAction ? ' action' : '');
  hintEl.textContent = isHidden ? '탭하면 정답 공개' : '';

  quizBtn.style.display = isAnswer ? '' : 'none';
  quizBtn.textContent = isHidden ? '정답 보기' : '정답 다시 가리기';

  counterText.textContent = `${i + 1} / ${DATA.length}`;
  sceneText.textContent = scene;
  prevBtn.disabled = i === 0;
  nextBtn.textContent = i === DATA.length - 1 ? '처음으로 ↺' : '다음 →';

  [...jumpEl.children].forEach(b => b.classList.toggle('active', b.textContent === scene));
  buildScenebar();
  renderPicker();
}

function renderPicker(){
  const [, kind] = DATA[i];
  const show = kind === '질문';
  pickerEl.style.display = show ? 'flex' : 'none';
  if(!show) return;
  const picked = picks[i];
  chips.forEach(c => {
    const n = Number(c.dataset.n);
    c.style.display = n <= teamSize ? 'flex' : 'none';
    c.classList.toggle('active', picked === n);
  });
  pickBtn.textContent = picked ? '다시 뽑기' : '번호 뽑기';
  pickHint.textContent = seen.size < teamSize
    ? `아직 안 나온 번호: ${allNumbers().filter(n => !seen.has(n)).join(', ')} — 먼저 나와야 해요`
    : `1~${teamSize}번 모두 나왔어요 (중복 가능, 연속만 제외)`;
}

pickBtn.addEventListener('click', () => {
  if(spinning) return;
  const finalPick = pickNumber();
  if(reduceMotion){
    picks[i] = finalPick;
    renderPicker();
    return;
  }
  spinning = true;
  pickBtn.disabled = true;
  let tick = 0;
  const visibleChips = chips.filter(c => Number(c.dataset.n) <= teamSize);
  const spin = setInterval(() => {
    chips.forEach(c => c.classList.remove('active'));
    visibleChips[tick % visibleChips.length].classList.add('active');
    tick++;
    if(tick > 9){
      clearInterval(spin);
      picks[i] = finalPick;
      spinning = false;
      pickBtn.disabled = false;
      renderPicker();
    }
  }, 80);
});

enEl.addEventListener('click', () => { if(DATA[i][1] === '정답' && !revealed.has(i)){ revealed.add(i); render(); } });
krEl.addEventListener('click', () => { if(DATA[i][1] === '정답' && !revealed.has(i)){ revealed.add(i); render(); } });

prevBtn.addEventListener('click', () => { if(i > 0){ i--; render(); } });
nextBtn.addEventListener('click', () => {
  const wrapping = i === DATA.length - 1;
  i = wrapping ? 0 : i + 1;
  if(wrapping){
    resetPickState();
    revealed.clear();
  }
  render();
});

sizeBtns.forEach(b => b.addEventListener('click', () => {
  const n = Number(b.dataset.size);
  if(n === teamSize) return;
  teamSize = n;
  sizeBtns.forEach(x => x.classList.toggle('active', Number(x.dataset.size) === teamSize));
  resetPickState();
  render();
}));
quizBtn.addEventListener('click', () => {
  if(revealed.has(i)) revealed.delete(i); else revealed.add(i);
  render();
});

document.addEventListener('keydown', (e) => {
  if(stageEl.classList.contains('list')) return;
  if(e.key === 'ArrowRight') nextBtn.click();
  if(e.key === 'ArrowLeft') prevBtn.click();
});

listToggle.addEventListener('click', () => {
  const show = !stageEl.classList.contains('list');
  stageEl.classList.toggle('list', show);
  listwrapEl.classList.toggle('show', show);
  listToggle.textContent = show ? '카드 모드로' : '전체 대본';
  if(show && listwrapEl.children.length === 0){
    DATA.forEach(([scene, kind, speaker, tag, en, kr], idx) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="meta">
          <span class="badge ${kind}" style="font-size:11px;padding:3px 9px 3px 8px;">${tag ? kind+' · '+tag : kind}</span>
          <span class="n">${String(idx+1).padStart(2,'0')} · ${scene} · ${speaker}</span>
        </div>
        <div class="en">${en.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
        <div class="kr">${kr}</div>`;
      listwrapEl.appendChild(row);
    });
  }
});

qrToggle.addEventListener('click', () => {
  const show = !qrPanel.classList.contains('show');
  qrPanel.classList.toggle('show', show);
  qrToggle.classList.toggle('active', show);
});

buildJump();
render();
</script>
